{% extends 'main.html' %}

{% block content %}

<div class="login-page">

    <div class="login-box">

        <h2>Login</h2>

        <p class="login-subtitle">
            Welcome back! Please login to your account.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label>Username</label>

            <input type="text"
                   name="username"
                   placeholder="Enter username"
                   required>


            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="Enter password"
                   required>


            <button type="submit">
                Login
            </button>


            <p class="register-link">

                Don't have an account?

                <a href="{% url 'register' %}">
                    Register
                </a>

            </p>

        </form>

    </div>

</div>

{% endblock content %}
