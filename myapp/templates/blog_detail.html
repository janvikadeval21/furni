
{% extends "main.html" %}
{% load static %}

{% block content %}

<!-- =========================================================
     BLOG DETAIL
========================================================= -->

<div class="blog-detail-section">

    <div class="container">

        <div class="blog-detail">


            <!-- BLOG TITLE -->
            <h1 class="blog-detail-title">
                {{ blog.title }}
            </h1>


            <!-- AUTHOR + DATE -->
            <div class="blog-detail-meta">

                <span>
                    <i class="fa fa-user"></i>
                    By {{ blog.author }}
                </span>

                <span>
                    <i class="fa fa-calendar"></i>
                    {{ blog.created_at|date:"F d, Y" }}
                </span>

            </div>


            <!-- =================================================
                 ALL BLOG IMAGES
            ================================================= -->

             <div class="blog-detail-images">

                {% for blog_image in blog.images.all %}

                    <div class="blog-detail-image">

                        <img src="{{ blog_image.image.url }}"
                            alt="{{ blog.title }}">

                    </div>

                {% endfor %}

            </div>
            <!-- =================================================
                 FULL BLOG CONTENT
            ================================================= -->

            <div class="blog-detail-content">

                {{ blog.content|linebreaks }}

            </div>


            <!-- =================================================
                 BACK BUTTON
            ================================================= -->

            <div class="blog-detail-back">

                <a href="{% url 'blog' %}"
                   class="blog-back-btn">

                    <span>←</span>
                    Back to Blog

                </a>

            </div>


        </div>

    </div>

<br>
<br>
<br>
<br>
</div>

{% endblock content %}
