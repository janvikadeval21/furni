{% extends "main.html" %}
{% load static %}

{% block content %}


<div class="untree_co-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card p-4 shadow-sm border-0 rounded-4 text-center">
                    
                    <h3 class="h4 mb-3 text-dark">Order #{{ order.id }}</h3>
                    <p class="text-muted small">Billed to: <strong>{{ user.get_full_name|default:user.username }}</strong></p>

                    <div class="p-3 my-3 bg-light rounded-3 d-flex justify-content-between align-items-center">
                        <span class="text-secondary fw-bold">Amount to Pay:</span>
                        <span class="h4 mb-0 text-success fw-bold">₹{{ order.total }}</span>
                    </div>

                    <!-- Payment Button -->
                    <button id="pay-button" class="btn btn-primary btn-lg w-100 py-3 mt-2" style="background-color: #3b5d50; border-color: #3b5d50; font-weight: 600;">
                        Pay ₹{{ order.total }} Now
                    </button>

                    <div id="payment-status" class="mt-3 text-center" style="display: none;"></div>

                    <div class="mt-4 p-2 bg-light rounded text-muted" style="font-size: 11px;">
                        🔒 Test Mode Active: Use <code>4111 1111 1111 1111</code> to test safely.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


{% csrf_token %}

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    var options = {
        "key": "{{ razorpay_key_id }}",
        "amount": {{ amount }}, 
        "currency": "INR",
        "name": "Furni Store",
        "description": "Payment for Order #{{ order.id }}",
        "order_id": "{{ razorpay_order_id }}",
        "handler": function (response) {
            console.log("Razorpay Response:", response);
            
            var statusDiv = document.getElementById("payment-status");
            if (statusDiv) {
                statusDiv.style.display = "block";
                statusDiv.innerHTML = '<span class="text-primary fw-bold">Verifying payment... Please wait.</span>';
            }

           
            fetch("/verify-payment/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie('csrftoken')
                },
                body: JSON.stringify({
                    razorpay_payment_id: response.razorpay_payment_id,
                    razorpay_order_id: response.razorpay_order_id,
                    razorpay_signature: response.razorpay_signature,
                    local_order_id: "{{ order.id }}"
                })
            })
            .then(function(res) {
                return res.json();
            })
            .then(function(data) {
                console.log("Server Verify Response:", data);
                if (data.status === "success") {
                    
                    window.location.href = data.redirect_url || "/order-success/";
                } else {
                    alert("Verification Failed: " + data.message);
                }
            })
            .catch(function(err) {
                console.error("Fetch Error:", err);
                alert("Server connection error during payment verification.");
            });
        },
        "prefill": {
            "name": "{{ user.get_full_name|default:user.username }}",
            "email": "{{ user.email|default:'customer@furni.com' }}",
            "contact": "9999999999"
        },
        "theme": {
            "color": "#3b5d50"
        },
        "modal": {
            "ondismiss": function() {
                console.log("Payment modal closed by user.");
            }
        }
    };

    var rzp = new Razorpay(options);

    rzp.on('payment.failed', function (response){
        console.error("Razorpay Error:", response.error);
        alert("Payment Error: " + response.error.description);
    });

    document.getElementById("pay-button").onclick = function(e) {
        rzp.open();
        e.preventDefault();
    };
</script>

{% endblock content%}
